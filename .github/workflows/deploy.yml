name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      APP_DIR: /home/${{ secrets.EC2_USER }}/nawaloka
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=""
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the production environment:$missing"
            exit 1
          fi

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Cannot reach EC2_HOST on port 22. Check the security group allows SSH from 0.0.0.0/0, the instance is running, and EC2_HOST is only the IP or DNS name."
            exit 1
          fi

      - name: Upload compose and nginx config
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" "mkdir -p $APP_DIR/traces $APP_DIR/nginx"
          scp -i ~/.ssh/deploy_key docker-compose.yml "$TARGET:$APP_DIR/docker-compose.yml"
          scp -i ~/.ssh/deploy_key nginx/nginx.conf "$TARGET:$APP_DIR/nginx/nginx.conf"
          if ! ssh -i ~/.ssh/deploy_key "$TARGET" "test -s $APP_DIR/.env"; then
            echo "::error::$APP_DIR/.env is missing on the server. Create it from .env.example."
            exit 1
          fi

      - name: Pull and restart
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" bash -s <<EOF
          set -euo pipefail
          cd "$APP_DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export IMAGE="$IMAGE"
          docker compose pull
          docker compose up -d --no-build --remove-orphans
          docker logout ghcr.io
          EOF

      - name: Wait for healthy app
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key "$TARGET" bash -s -- "$APP_DIR" <<'EOF'
          cd "$1"
          app_health=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")
          [ "$app_health" = healthy ] && curl -fsS http://localhost/healthz >/dev/null
          EOF
            then
              echo "App and nginx are healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::App did not become healthy"
          ssh -i ~/.ssh/deploy_key "$TARGET" "cd $APP_DIR && docker compose ps && docker compose logs --tail 100"
          exit 1

      - name: Remove old images
        if: success()
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$TARGET" "docker image prune -af --filter until=168h"
