services:
  app:
    image: ${IMAGE:-nawaloka:local}
    build: .
    restart: unless-stopped
    expose:
      - "8501"
    env_file:
      - .env
    volumes:
      - ./traces:/app/traces

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      app:
        condition: service_healthy
